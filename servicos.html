<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serviços — Arte da Cópia</title>
  <meta name="description" content="Explore nossos produtos personalizados: canecas, camisas, almofadas e mais.">
  <link rel="stylesheet" href="/css/main.css">
  <script>
    (function(){
      const t = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>

  <header id="header"></header>

  <main id="servicos">

    <div class="servicos-header">
      <h1>Serviços &amp; Produtos</h1>
      <p>Filtre por categoria ou use a busca para encontrar o que precisa.</p>
    </div>

    <!-- Toolbar: busca + chips de filtro (montado via JS) -->
    <div class="servicos-toolbar" id="servicos-toolbar"></div>

    <!-- Contagem de resultados -->
    <p class="results-info" id="results-info"></p>

    <!-- Grid de cards -->
    <div id="products-grid"></div>

    <!-- Estado vazio -->
    <div id="empty-state">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
        <path d="M8 11h6"/>
      </svg>
      <h3>Nenhum produto encontrado</h3>
      <p>Tente outro termo ou remova os filtros.</p>
    </div>

  </main>

  <footer></footer>

  <script src="/js/main.js"></script>
  <script src="/js/servicos.js"></script>

  <script>
    // Support ?cat=xxx URL param to pre-select category
    (function(){
      const params = new URLSearchParams(window.location.search);
      const cat = params.get('cat');
      if (cat) {
        // Override the DEFAULT_FILTER via global var before DOMContentLoaded fires
        window.__CAT_OVERRIDE__ = cat;
      }
    })();
  </script>
</body>
</html>
