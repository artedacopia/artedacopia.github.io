    <script>
        // Seleciona todos os links que contêm imagens
        const links = document.querySelectorAll('a[href$=".jpg"], a[href$=".jpeg"], a[href$=".png"]');

        // Seleciona o lightbox e a imagem dentro dele
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function updateLightboxImage() {
            lightboxImg.src = links[currentIndex].href;
        }

        // Adiciona um evento de clique a cada link
        links.forEach((link, index) => {
            link.addEventListener('click', function(event) {
                event.preventDefault();

                currentIndex = index; // <<< ESSENCIAL
                updateLightboxImage();

                lightbox.style.display = 'flex';
            });
        });


        // Adiciona um evento de clique ao lightbox para fechá-lo
        lightbox.addEventListener('click', function() {
            lightbox.style.display = 'none';
            lightboxImg.src = ''; // Limpa a fonte da imagem
        });
        // Seleciona os botões de navegação

        let currentIndex = 0;

        function nextImage() {
            currentIndex = (currentIndex + 1) % links.length;
            updateLightboxImage();
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + links.length) % links.length;
            updateLightboxImage();
        }

        let startX = 0;
        let endX = 0;

        lightbox.addEventListener('touchstart', function(e) {
            startX = e.touches[0].clientX;
        }, { passive: true });

        lightbox.addEventListener('touchend', function(e) {
            endX = e.changedTouches[0].clientX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const diff = startX - endX;

            // ajuste de sensibilidade (quanto maior, mais "forte" o swipe)
            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    // swipe para esquerda → próxima imagem
                    currentIndex = (currentIndex + 1) % links.length;
                } else {
                    // swipe para direita → imagem anterior
                    currentIndex = (currentIndex - 1 + links.length) % links.length;
                }
                updateLightboxImage();
            }
        }

        document.addEventListener('keydown', function(event) {
        // só funciona se o lightbox estiver aberto
        if (lightbox.style.display !== 'flex') return;

        if (event.key === 'ArrowRight') {
            nextImage();
        }

        if (event.key === 'ArrowLeft') {
            prevImage();
        }

        if (event.key === 'Escape') {
            lightbox.style.display = 'none';
            lightboxImg.src = '';
        }
    });


    </script>
