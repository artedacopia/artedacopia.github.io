<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Multiplicador de Páginas PDF</title>
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>
<body>

  <h2>Multiplicador de Páginas PDF</h2>

  <input type="file" id="pdfInput" accept="application/pdf" />
  <br><br>

  <input type="text" id="referencias" 
         placeholder="Ex: pg1=8,pg2=3,pg4=7" size="40"/>
  <br><br>

  <button onclick="gerarPDF()">Gerar PDF</button>

  <script>
    async function gerarPDF() {
      const input = document.getElementById("pdfInput");
      const referencias = document.getElementById("referencias").value;

      if (!input.files.length) {
        alert("Selecione um PDF.");
        return;
      }

      const file = input.files[0];
      const arrayBuffer = await file.arrayBuffer();

      const { PDFDocument } = PDFLib;
      const pdfOriginal = await PDFDocument.load(arrayBuffer);
      const novoPdf = await PDFDocument.create();

      const listaPaginas = parseReferencias(referencias);

      for (let paginaIndex of listaPaginas) {
        if (paginaIndex >= 0 && paginaIndex < pdfOriginal.getPageCount()) {
          const [paginaCopiada] = await novoPdf.copyPages(pdfOriginal, [paginaIndex]);
          novoPdf.addPage(paginaCopiada);
        } else {
          alert("Página inválida: " + (paginaIndex + 1));
        }
      }

      const pdfBytes = await novoPdf.save();

      const blob = new Blob([pdfBytes], { type: "application/pdf" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "pdf_repetido.pdf";
      a.click();

      URL.revokeObjectURL(url);
    }

    function parseReferencias(texto) {
      const partes = texto.split(",");
      const resultado = [];

      for (let parte of partes) {
        parte = parte.trim().toLowerCase();

        if (parte.startsWith("pg") && parte.includes("=")) {
          const [pagina, quantidade] = parte.split("=");

          const numeroPagina = parseInt(pagina.replace("pg", ""));
          const qtd = parseInt(quantidade);

          for (let i = 0; i < qtd; i++) {
            resultado.push(numeroPagina - 1);
          }
        }
      }

      return resultado;
    }
  </script>

</body>
</html>
